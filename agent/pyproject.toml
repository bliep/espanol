[project]
name = "tutor-agent"
version = "0.1.0"
description = "Spanish voice tutor agent (LiveKit Agents)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17.0",
    "asyncpg>=0.32.0",
    "azure-cognitiveservices-speech>=1.53.0",
    "fsrs>=6.3.2",
    "livekit-agents[anthropic,cartesia,deepgram,silero,turn-detector]>=1.8.11",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
